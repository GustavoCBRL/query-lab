{% extends "study_hub/layout.html" %} 
{% block body %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="navbar-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
        <i class="fa-solid fa-terminal"></i>
      </div>
      <h2 class="h3 fw-bold text-white mb-1">Create Account</h2>
      <p class="text-muted small">Join QueryLab to save your progress and practice queries</p>
    </div>

    {% if message %}
      <div class="alert alert-custom-danger mb-4 py-2 px-3 small">
        <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
      </div>
    {% endif %}

    <form action="{% url 'register' %}" method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label-custom">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
          <input
            id="username"
            type="text"
            class="form-control form-control-dark"
            name="username"
            placeholder="Choose a username"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label-custom">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
          <input
            type="email"
            class="form-control form-control-dark"
            name="email"
            id="email"
            placeholder="name@example.com"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label-custom">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
          <input
            id="password"
            type="password"
            class="form-control form-control-dark"
            name="password"
            placeholder="Create password"
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label for="confirmation" class="form-label-custom">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-shield-halved"></i></span>
          <input
            id="confirmation"
            type="password"
            class="form-control form-control-dark"
            name="confirmation"
            placeholder="Repeat password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 justify-content-center mb-3">
        <i class="fa-solid fa-user-plus me-1"></i> Register Account
      </button>
    </form>

    <div class="text-center text-muted small border-top pt-3" style="border-color: rgba(255,255,255,0.08) !important;">
      Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Log In here</a>
    </div>     
  </div>
</div>

{% endblock %}
