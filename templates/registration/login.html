{% extends "study_hub/layout.html" %}
{% load crispy_forms_tags %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="navbar-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
        <i class="fa-solid fa-terminal"></i>
      </div>
      <h2 class="h3 fw-bold text-white mb-1">Welcome Back</h2>
      <p class="text-muted small">Log in to access your QueryLab workspace</p>
    </div>

    <form action="{% url 'login' %}" method="post">
      {% csrf_token %}
      <div class="mb-3">
        {{ form|crispy }}
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 justify-content-center mb-3">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Log In
      </button>

      <div class="text-center mb-3">
        <a href="{% url 'password_reset' %}" class="text-muted small text-decoration-none hover-white">
          <i class="fa-solid fa-key me-1"></i> Forgot your password?
        </a>
      </div>
    </form>

    <div class="text-center text-muted small border-top pt-3" style="border-color: rgba(255,255,255,0.08) !important;">
      Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
