{% extends "study_hub/layout.html" %}

{% block body %}
<div class="auth-wrapper">
    <div class="auth-card text-center">
        <div class="stat-icon stat-icon-green mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <h2 class="h3 fw-bold text-white mb-2">Check Your Email</h2>
        <p class="text-muted small mb-4">
            If an account with that email exists, we have sent step-by-step password reset instructions.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary-custom w-100 justify-content-center">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Login
        </a>
    </div>
</div>
{% endblock %}
