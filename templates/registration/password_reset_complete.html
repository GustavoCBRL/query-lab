{% extends "study_hub/layout.html" %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card text-center">
    <div class="stat-icon stat-icon-green mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <h2 class="h3 fw-bold text-white mb-2">Password Updated</h2>
    <p class="text-muted small mb-4">Your password has been reset successfully. You can now log in with your new password.</p>

    <a href="{% url 'login' %}" class="btn btn-primary-custom w-100 justify-content-center">
      <i class="fa-solid fa-right-to-bracket me-1"></i> Go to Login
    </a>
  </div>
</div>
{% endblock %}
