{% extends "study_hub/layout.html" %}
{% load crispy_forms_tags %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="navbar-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="h3 fw-bold text-white mb-1">Reset Password</h2>
      <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        {{ form|crispy }}
      </div>
      <button type="submit" class="btn btn-primary-custom w-100 justify-content-center mb-3">
        <i class="fa-solid fa-paper-plane me-1"></i> Send Reset Link
      </button>
    </form>

    <div class="text-center text-muted small border-top pt-3" style="border-color: rgba(255,255,255,0.08) !important;">
      <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
