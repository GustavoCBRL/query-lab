{% extends "study_hub/layout.html" %}
{% load crispy_forms_tags %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="navbar-brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.25rem;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="h3 fw-bold text-white mb-1">Set New Password</h2>
    </div>

    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          {{ form|crispy }}
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 justify-content-center">
          <i class="fa-solid fa-check me-1"></i> Change Password
        </button>
      </form>
    {% else %}
      <div class="alert alert-custom-danger mb-0 text-center">
        <i class="fa-solid fa-triangle-exclamation mb-2 fs-3 d-block"></i>
        This password reset link is invalid or has expired.
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
